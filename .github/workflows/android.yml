name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Vortex Standalone APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-disabled: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build web frontend
        run: npm run build

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Copy web assets to Android
        run: |
          mkdir -p android/app/src/main/assets/public
          cp -r dist/* android/app/src/main/assets/public/
          npx cap copy android || true

      - name: Build Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace --info > ../gradle.log 2>&1 || (echo "=== GRADLE FAILURE ===" && grep -E "error:|FAILURE:|FAILED|Exception:" -A 8 ../gradle.log | head -n 120 && exit 1)
          mkdir -p ../dist-apk
          find . -name "*.apk" -exec cp -v {} ../dist-apk/ \;
          ls -la ../dist-apk/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Vortex-Android-APK
          path: dist-apk/
          if-no-files-found: warn

      - name: Upload Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-log
          path: gradle.log
          if-no-files-found: ignore
